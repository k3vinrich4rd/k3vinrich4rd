# Mantém o RKF Bank em produção acordado.
# Por quê: o Render Free dorme a API após 15 min sem uso e a Aiven desliga o MySQL gratuito
# quando ele fica muito tempo sem conexão ("Inactive free service powered off", 04/11/2026).
# A cada 3 horas este job chama /actuator/health: a API acorda e conecta no banco.
# Se falhar (ex.: banco desligado), o job fica vermelho e o GitHub manda e-mail ao Kevin.
name: Manter RKF Bank no ar

on:
  schedule:
    - cron: "17 */3 * * *"   # a cada 3 horas (UTC), no minuto 17
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # O deploy do Renan não deixa o job do Kevin vermelho (ele cuida do dele).
    continue-on-error: ${{ matrix.quem == 'Renan' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - quem: Kevin
            api: https://rkfbank-api-zncu.onrender.com
          # Pelo site: o BFF do Next repassa /api/* para a API do Renan no Render.
          - quem: Renan
            api: https://rkf-bank.vercel.app/api
    name: ping (${{ matrix.quem }})
    steps:
      - name: Acordar a API e checar o banco
        env:
          API: ${{ matrix.api }}
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            codigo=$(curl -s -m 90 -o resposta.json -w '%{http_code}' "$API/actuator/health" || true)
            echo "tentativa $i: HTTP $codigo $(cat resposta.json 2>/dev/null)"
            if [ "$codigo" = "200" ] && grep -q '"UP"' resposta.json; then
              echo "✅ $API no ar"
              exit 0
            fi
            sleep 30
          done
          echo "::error::$API não respondeu UP. Veja se o MySQL na Aiven está 'Powered off' (console.aiven.io) e os logs no Render."
          exit 1

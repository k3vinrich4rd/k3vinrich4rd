# Mantém o README vivo: repositórios, gráficos, commits recentes e SVGs animados.
# Os dados do Obsidian chegam pelo progresso.json (enviado pelo hook de commit da máquina do Kevin).
# Roda a cada 6h, a cada push na main e pelo botão "Run workflow" na aba Actions.
name: Atualizar README

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [atualizar-readme]
  push:
    branches: [main]
    paths:
      - progresso.json
      - scripts/**
      - .github/workflows/atualizar-readme.yml

permissions:
  contents: write

concurrency:
  group: atualizar-readme
  cancel-in-progress: false

jobs:
  readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gerar README e SVGs
        run: node scripts/atualizar-readme.mjs --api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commitar se mudou
        run: |
          if git diff --quiet; then echo "Nada mudou."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          git commit -m "docs(perfil): atualização automática do README"
          git push

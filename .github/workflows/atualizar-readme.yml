# Mantém o README vivo: repositórios, gráficos, commits recentes e SVGs animados.
# Os dados do Obsidian chegam pelo progresso.json (enviado pelo hook de commit da máquina do Kevin).
# Roda a cada 6h, a cada push na main e pelo botão "Run workflow" na aba Actions.
name: Atualizar README

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [atualizar-readme]
  push:
    branches: [main]
    paths:
      - progresso.json
      - cursos.json
      - scripts/**
      - .github/workflows/atualizar-readme.yml

permissions:
  contents: write

concurrency:
  group: atualizar-readme
  cancel-in-progress: false

jobs:
  readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # o passo de commit consulta os commits do dia

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gerar README e SVGs
        run: node scripts/atualizar-readme.mjs --api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Ofensiva com o PC desligado: a primeira atualização do dia (a dica muda à meia-noite de Brasília) sai
      # com o autor Kevin quando ele ainda não tem commit hoje; as demais seguem como github-actions[bot].
      - name: Commitar se mudou
        env:
          KEVIN_NOME: k3vinrich4rd
          KEVIN_EMAIL: kevinrichardve@gmail.com
        run: |
          if git diff --quiet; then echo "Nada mudou."; exit 0; fi
          meia_noite="$(TZ=America/Sao_Paulo date +%F)T00:00:00-03:00" # Brasília não tem mais horário de verão
          if [ -z "$(git log origin/main --author="$KEVIN_EMAIL" --since="$meia_noite" --format=%h)" ]; then
            git config user.name "$KEVIN_NOME"
            git config user.email "$KEVIN_EMAIL"
            mensagem="docs(perfil): atualização diária do README"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            mensagem="docs(perfil): atualização automática do README"
          fi
          git add README.md assets
          git commit -m "$mensagem"
          git push || { git pull --rebase -X theirs && git push; }

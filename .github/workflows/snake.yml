# Gera a "cobrinha" que come o gráfico de commits e o gráfico 3D de contribuições, e publica na branch "output".
# O README lê os SVGs de https://raw.githubusercontent.com/k3vinrich4rd/k3vinrich4rd/output/
# Roda sozinho a cada 6h, a cada push na main e pelo botão "Run workflow" na aba Actions.
name: Gerar cobrinha

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar SVGs da cobrinha
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#EC7000&color_dots=#ebedf0,#9ecbff,#4a90d9,#003D74,#002447
            dist/snake-dark.svg?palette=github-dark&color_snake=#EC7000&color_dots=#161b22,#0b2a4a,#003D74,#c25a00,#EC7000

      - name: Gerar gráfico 3D de contribuições
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Juntar os arquivos
        run: cp profile-3d-contrib/*.svg dist/

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Kevin Richard, desenvolvedor Java backend. Régua Pleno 12 de 15, 360 testes no RKF Bank.">
  <!-- Gerado por scripts/atualizar-readme.mjs a partir de progresso.json. Não edite à mão. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset=".55" stop-color="#0b1b33"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
    <radialGradient id="glowL" cx=".15" cy=".2" r=".6"><stop offset="0" stop-color="#003D74" stop-opacity=".55"/><stop offset="1" stop-color="#003D74" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowR" cx=".85" cy=".85" r=".55"><stop offset="0" stop-color="#EC7000" stop-opacity=".35"/><stop offset="1" stop-color="#EC7000" stop-opacity="0"/></radialGradient>
    <linearGradient id="marca" x1="0" x2="1"><stop offset="0" stop-color="#EC7000"/><stop offset="1" stop-color="#ffb366"/></linearGradient>
    <linearGradient id="prog" x1="0" x2="1"><stop offset="0" stop-color="#003D74"/><stop offset="1" stop-color="#EC7000"/></linearGradient>
    <pattern id="grade" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1f6feb" stroke-opacity=".08"/></pattern>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: Consolas, 'Fira Code', 'JetBrains Mono', Menlo, monospace; font-size: 15px; }
    .tok { font-family: Consolas, Menlo, monospace; font-size: 13px; fill: #58a6ff; opacity: 0; animation: subir 14s linear infinite; }
    @keyframes subir { 0% { opacity: 0; transform: translateY(30px); } 15% { opacity: .16; } 85% { opacity: .16; } 100% { opacity: 0; transform: translateY(-60px); } }
    .entra { opacity: 0; animation: entra .8s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes entra { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: none; } }
    .ln { opacity: 0; animation: mostra .01s forwards; }
    @keyframes mostra { to { opacity: 1; } }
    .key { fill: #8b949e; } .val { fill: #e6edf3; } .ok { fill: #3fb950; font-weight: bold; } .or { fill: #EC7000; font-weight: bold; }
    .cursor { animation: pisca 1s step-end infinite; }
    @keyframes pisca { 50% { opacity: 0; } }
    .digita { clip-path: inset(0 100% 0 0); animation: digita 1s steps(14) .3s forwards; }
    @keyframes digita { to { clip-path: inset(0 0 0 0); } }
    .enche { transform: scaleX(0); transform-origin: left; animation: enche 1.6s cubic-bezier(.2,.8,.2,1) 3.30s forwards; }
    @keyframes enche { to { transform: scaleX(1); } }
    .pulso { animation: pulso 1.8s ease-in-out infinite; transform-origin: 54px 64px; }
    @keyframes pulso { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    .scan { animation: scan 6s linear infinite; }
    .aceno { animation: aceno 1.8s ease-in-out infinite; }
    @keyframes aceno { 0%,55%,100% { transform: rotate(0deg); } 12%,36% { transform: rotate(16deg); } 24%,48% { transform: rotate(-10deg); } }
    .anda-avatar { animation: passo .5s ease-in-out infinite alternate; }
    @keyframes passo { from { transform: translateY(0); } to { transform: translateY(-4px); } }
    @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(440px); } }
  </style>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grade)"/>
  <rect width="1200" height="400" fill="url(#glowL)"/>
  <rect width="1200" height="400" fill="url(#glowR)"/>
  <rect class="scan" width="1200" height="40" fill="#EC7000" opacity=".035"/>
  <g>
    <text x="30" y="60" class="tok" style="animation-delay:-0.0s">@Transactional</text>
    <text x="127" y="113" class="tok" style="animation-delay:-1.7s">@Version</text>
    <text x="224" y="166" class="tok" style="animation-delay:-3.4s">git push origin develop</text>
    <text x="321" y="219" class="tok" style="animation-delay:-5.1s">HTTP 201 Created</text>
    <text x="418" y="272" class="tok" style="animation-delay:-6.8s">SELECT * FROM tb_conta</text>
    <text x="515" y="325" class="tok" style="animation-delay:-8.5s">@DataJpaTest</text>
    <text x="612" y="78" class="tok" style="animation-delay:-10.2s">X-Request-Id</text>
    <text x="69" y="131" class="tok" style="animation-delay:-11.9s">mvn verify</text>
    <text x="166" y="184" class="tok" style="animation-delay:-13.6s">docker compose up</text>
    <text x="263" y="237" class="tok" style="animation-delay:-15.3s">@RestController</text>
    <text x="360" y="290" class="tok" style="animation-delay:-17.0s">BigDecimal saldo</text>
    <text x="457" y="343" class="tok" style="animation-delay:-18.7s">Spring Boot 4</text>
  </g>

  <g class="sans">
    <text x="40" y="150" font-size="64" font-weight="800" fill="#ffffff" class="entra" style="animation-delay:.3s">Kevin Richard</text>
    <text x="42" y="196" font-size="28" font-weight="700" fill="url(#marca)" class="entra" style="animation-delay:.5s">Java Backend Developer</text>
    <text x="42" y="230" font-size="17" fill="#c9d1d9" class="entra" style="animation-delay:.7s">Spring Boot · JPA/Hibernate · Testes · CI/CD · Cloud</text>
    <text x="42" y="258" font-size="15" fill="#8b949e" class="entra" style="animation-delay:.9s">Zup Innovation · serviço para o Itaú Unibanco · Osasco, SP</text>

    <g class="entra" style="animation-delay:1.1s">
      <rect x="40" y="296" width="170" height="58" rx="10" fill="#0d1117" stroke="#30363d"/>
      <text x="56" y="322" font-size="22" font-weight="800" fill="#EC7000">12/15</text>
      <text x="56" y="342" font-size="12" fill="#8b949e">competências de Pleno</text>
      <rect x="222" y="296" width="170" height="58" rx="10" fill="#0d1117" stroke="#30363d"/>
      <text x="238" y="322" font-size="22" font-weight="800" fill="#3fb950">360</text>
      <text x="238" y="342" font-size="12" fill="#8b949e">testes verdes no RKF Bank</text>
      <rect x="404" y="296" width="170" height="58" rx="10" fill="#0d1117" stroke="#30363d"/>
      <text x="420" y="322" font-size="22" font-weight="800" fill="#58a6ff">10/15</text>
      <text x="420" y="342" font-size="12" fill="#8b949e">entregas do MVP</text>
    </g>
  </g>

  <g class="entra" style="animation-delay:1.3s"><g transform="translate(566 214) scale(0.95)">
    <g class="">
      <ellipse cx="50" cy="121" rx="30" ry="3" fill="#000" opacity=".35"/>
      <path d="M12 120 C12 90 29 78 50 78 C71 78 88 90 88 120 Z" fill="#003D74"/>
      <path d="M50 80 L50 120" stroke="#EC7000" stroke-width="2.5"/>
      <path d="M38 80 Q50 92 62 80" fill="none" stroke="#0a2c52" stroke-width="3"/>
      <rect x="42" y="62" width="16" height="18" rx="5" fill="#45281a"/>
      <circle cx="28" cy="46" r="5.5" fill="#45281a"/>
      <circle cx="72" cy="46" r="5.5" fill="#45281a"/>
      <ellipse cx="50" cy="44" rx="22" ry="25" fill="#5a3520"/>
      <!-- cabelo na máquina 1: sombra fina e rente, acompanhando o formato do crânio -->
      <path d="M28.5 40 C27 24 37 19.5 50 19.5 C63 19.5 73 24 71.5 40 C69 31 61 28.5 50 28.5 C39 28.5 31 31 28.5 40 Z" fill="#121212" opacity=".88"/>
      <path d="M30 38 C32 27 40 23 50 23 C60 23 68 27 70 38" fill="none" stroke="#121212" stroke-width="1" opacity=".5"/>
      <path d="M38 38 h7 M55 38 h7" stroke="#121212" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="42" cy="45" r="2.4" fill="#0d0d0d"/>
      <circle cx="58" cy="45" r="2.4" fill="#0d0d0d"/>
      <!-- bigode e barbicha -->
      <path d="M40.5 54 C43 51.5 47.5 52.5 50 54.2 C52.5 52.5 57 51.5 59.5 54 C57 56.6 53 56 50 55.4 C47 56 43 56.6 40.5 54 Z" fill="#121212"/>
      <path d="M45 63.5 C46 66 48 69.5 50 70.5 C52 69.5 54 66 55 63.5 C53 64.6 47 64.6 45 63.5 Z" fill="#121212"/>
      <path d="M45 59.4 Q50 62.6 55 59.4" stroke="#f2e6dc" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <g class="aceno" style="transform-origin: 80px 92px">
        <path d="M78 92 Q92 74 94 56" stroke="#003D74" stroke-width="11" stroke-linecap="round" fill="none"/>
        <circle cx="94" cy="52" r="7" fill="#5a3520"/>
      </g>
    </g>
  </g></g>

  <g transform="translate(680 40)">
    <rect width="480" height="320" rx="12" fill="#0d1117" fill-opacity=".92" stroke="#30363d"/>
    <rect width="480" height="34" rx="12" fill="#161b22"/>
    <rect y="22" width="480" height="12" fill="#161b22"/>
    <circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="40" cy="17" r="6" fill="#ffbd2e"/><circle cx="60" cy="17" r="6" fill="#27c93f"/>
    <text x="240" y="22" text-anchor="middle" class="mono" font-size="12" fill="#8b949e">kevin@zup: ~ — bash</text>
    <text x="24" y="64" class="mono"><tspan fill="#EC7000" font-weight="bold">➜ </tspan><tspan fill="#58a6ff">~ </tspan><tspan class="digita" fill="#e6edf3">kevin --status</tspan></text>
    <g>
      <text x="24" y="92" class="mono ln" style="animation-delay:1.20s"><tspan class="key">nível</tspan><tspan x="110" class="val">Junior → Pleno</tspan></text>
      <text x="24" y="117" class="mono ln" style="animation-delay:1.55s"><tspan class="key">empresa</tspan><tspan x="110" class="val">Zup Innovation · Itaú</tspan></text>
      <text x="24" y="142" class="mono ln" style="animation-delay:1.90s"><tspan class="key">stack</tspan><tspan x="110" class="val">Java 25 · Spring Boot 4</tspan></text>
      <text x="24" y="167" class="mono ln" style="animation-delay:2.25s"><tspan class="key">projeto</tspan><tspan x="110" class="val">RKF Bank (banco digital)</tspan></text>
      <text x="24" y="192" class="mono ln" style="animation-delay:2.60s"><tspan class="key">testes</tspan><tspan x="110" class="ok">360 ✔ BUILD SUCCESS</tspan></text>
      <text x="24" y="217" class="mono ln" style="animation-delay:2.95s"><tspan class="key">foco</tspan><tspan x="110" class="or">AWS → inglês → mensageria</tspan></text>
    </g>
    <g class="ln" style="animation-delay:3.30s">
      <text x="24" y="246" class="mono key">pleno</text>
      <rect x="110" y="233" width="290" height="14" rx="7" fill="#21262d"/>
      <rect x="110" y="233" width="232" height="14" rx="7" fill="url(#prog)" class="enche"/>
      <text x="410" y="246" class="mono or">80%</text>
    </g>
    <text x="24" y="278" class="mono ln" style="animation-delay:3.90s"><tspan fill="#EC7000" font-weight="bold">➜ </tspan><tspan fill="#58a6ff">~ </tspan><tspan class="cursor" fill="#e6edf3">▌</tspan></text>
  </g>
</svg>

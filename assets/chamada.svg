<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-label="Vamos conversar? Desenvolvedor Java backend na Zup Innovation. Clique para falar comigo no LinkedIn.">

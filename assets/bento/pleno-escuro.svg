<svg xmlns="http://www.w3.org/2000/svg" width="400" height="190" viewBox="0 0 400 190" role="img" aria-label="Júnior → Pleno: Competências com evidência em código">
  <!-- Proposta do Vitrine · GitHub (bento do topo). Sem números, para nunca ficar desatualizado. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#0F2747"/></linearGradient>
    <linearGradient id="brilho" x1="0" x2="1"><stop offset="0" stop-color="#A78BFA" stop-opacity="0"/><stop offset=".5" stop-color="#A78BFA" stop-opacity=".9"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect width="400" height="190" rx="16"/></clipPath>
  </defs>
  <style>
    .t{font:700 30px 'Segoe UI',Ubuntu,'Helvetica Neue',sans-serif;fill:#F0F6FC}
    .s{font:500 14px 'Segoe UI',Ubuntu,sans-serif;fill:#F0F6FC;opacity:.9}
    .m{font:400 12.5px 'Segoe UI',Ubuntu,sans-serif;fill:#8B949E}
    .tag{font:700 10.5px 'Segoe UI',Ubuntu,sans-serif;letter-spacing:1.4px;fill:#A78BFA}
    .cta{font:700 13px 'Segoe UI',Ubuntu,sans-serif;fill:#A78BFA}
    .dot{animation:p 1.6s ease-in-out infinite;transform-origin:30px 30px}
    .sweep{animation:s 4.5s ease-in-out infinite}
    .in{animation:f .9s ease-out both}
    @keyframes p{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.6)}}
    @keyframes s{0%{transform:translateX(-420px)}60%,100%{transform:translateX(420px)}}
    @keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){.dot,.sweep,.in{animation:none}}
  </style>
  <g clip-path="url(#c)">
    <rect width="400" height="190" fill="url(#g)"/>
    <rect class="sweep" x="0" y="0" width="400" height="3" fill="url(#brilho)"/>
    <rect x="0" y="187" width="400" height="3" fill="#A78BFA" opacity=".85"/>
  </g>
  <rect x=".5" y=".5" width="399" height="189" rx="15.5" fill="none" stroke="#30363D"/>
  <circle class="dot" cx="30" cy="30" r="5" fill="#A78BFA"/>
  <text class="tag" x="44" y="34">RUMO AO PLENO</text>
  <g class="in"><text class="t" x="24" y="80">Júnior → Pleno</text>
  <text class="s" x="24" y="108">Competências com evidência em código</text>
  <text class="m" x="24" y="130">Régua, estudos e PDI 2026, ao vivo</text>
  <text class="cta" x="24" y="165">Ver onde estou ›</text></g>
</svg>
